# Xcode project for the Hyperpolymath iPhone app, its widgets and the Mac
# menu bar app. Generate it with XcodeGen (brew install xcodegen):
#
#   cd apple && xcodegen && open Hyperpolymath.xcodeproj
#
# Forks: change HPM_BUNDLE_PREFIX and HPM_APP_GROUP below (or in Xcode's
# build settings) to identifiers your Apple developer team owns, and set
# DEVELOPMENT_TEAM. Info.plist and entitlements files are generated from
# the properties here, so edit this file rather than those.

name: Hyperpolymath
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    HPM_BUNDLE_PREFIX: com.example.hyperpolymath
    HPM_APP_GROUP: group.com.example.hyperpolymath
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HyperpolymathKit:
    path: HyperpolymathKit

targets:
  Hyperpolymath:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    dependencies:
      - package: HyperpolymathKit
        product: HyperpolymathKit
      - package: HyperpolymathKit
        product: HyperpolymathUI
      - target: HyperpolymathWidgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Hyperpolymath
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HPMAppGroup: $(HPM_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - hyperpolymath
    entitlements:
      path: iOS/Hyperpolymath.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HPM_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HPM_BUNDLE_PREFIX)
        PRODUCT_NAME: Hyperpolymath
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  HyperpolymathWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: HyperpolymathKit
        product: HyperpolymathKit
      - package: HyperpolymathKit
        product: HyperpolymathUI
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hyperpolymath
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HPMAppGroup: $(HPM_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HyperpolymathWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HPM_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HPM_BUNDLE_PREFIX).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES

  HyperpolymathMac:
    type: application
    platform: macOS
    sources:
      - macOS
    dependencies:
      - package: HyperpolymathKit
        product: HyperpolymathKit
      - package: HyperpolymathKit
        product: HyperpolymathUI
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Hyperpolymath
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - hyperpolymath
    entitlements:
      path: macOS/HyperpolymathMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HPM_BUNDLE_PREFIX).mac
        PRODUCT_NAME: Hyperpolymath
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES

schemes:
  Hyperpolymath:
    build:
      targets:
        Hyperpolymath: all
        HyperpolymathWidgets: all
    run:
      config: Debug
  HyperpolymathMac:
    build:
      targets:
        HyperpolymathMac: all
    run:
      config: Debug
